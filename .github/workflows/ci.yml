name: Checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: risky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/risky_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - run: npm run build:netlify
      - run: npm run check:netlify
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/risky_test
